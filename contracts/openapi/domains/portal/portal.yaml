/portal/client/trust-unblock:
  post:
    tags:
      - ClientPortal
    summary: Solicita o Desbloqueio em Confiança (tolerância de 48h)
    operationId: requestClientPortalTrustUnblock
    security: []
    parameters:
      - name: customerId
        in: query
        required: false
        schema:
          $ref: '../../components/common.yaml#/UUIDv7'
      - name: X-Customer-Id
        in: header
        required: false
        schema:
          $ref: '../../components/common.yaml#/UUIDv7'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/TrustUnblockRequest'
    responses:
      '200':
        description: Desbloqueio em confiança concedido com sucesso.
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/TrustUnblockResponse'
      '400':
        description: Não elegível para desbloqueio em confiança.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'
      '401':
        description: Não autorizado.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'
      '404':
        description: Contrato não localizado.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'
