PlanCompositionCategory:
  type: string
  description: Categoria fiscal/tributária do item que compõe o plano de assinatura
  enum:
    - SCM
    - EQUIPMENT_RENTAL
    - SVA_DIGITAL_CONTENT
    - SVA_STREAMING_APP
    - SVA_OTHER
  example: "SCM"

PlanCompositionItemDto:
  type: object
  description: Item individual da composição financeira e tributária do plano (SCM, Locação de Equipamento, SVA Digital, Streaming, Outros SVAs)
  required:
    - name
    - category
    - amount
  properties:
    id:
      type: string
      format: uuid
      nullable: true
      example: "019633f8-a4b0-7d8e-9f12-34567890abcd"
    name:
      type: string
      description: Nome descritivo do serviço ou equipamento na fatura
      example: "Conectividade Fibra Óptica SCM"
    category:
      $ref: '#/PlanCompositionCategory'
    amount:
      type: number
      format: double
      minimum: 0.01
      description: Valor em Reais (BRL) correspondente a este item na mensalidade
      example: 59.90
    fiscalCode:
      type: string
      nullable: true
      description: Código CFOP / Classificação NFCom ou Código de Serviço SVA opcional
      example: "5307"

PlanResponse:
  type: object
  description: Dados cadastrais do Plano de Acesso à Internet
  required:
    - id
    - name
    - downloadSpeed
    - uploadSpeed
    - price
    - active
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      example: "01944883-9b48-7b89-9a2c-15a4b7f83b2a"
    name:
      type: string
      example: "Fibra Turbo 500 Mega"
    downloadSpeed:
      type: integer
      description: Velocidade nominal de download em Mbps
      example: 500
    uploadSpeed:
      type: integer
      description: Velocidade nominal de upload em Mbps
      example: 250
    price:
      type: number
      format: double
      description: Mensalidade em Reais (BRL)
      example: 99.90
    scmAmount:
      type: number
      format: double
      nullable: true
      description: Soma em Reais (BRL) dos itens de categoria SCM (base tributável NFCom Mod. 62)
      example: 59.90
    svaAmount:
      type: number
      format: double
      nullable: true
      description: Soma em Reais (BRL) dos itens de Locação e SVA (fora da base ICMS da NFCom)
      example: 40.00
    compositionItems:
      type: array
      items:
        $ref: '#/PlanCompositionItemDto'
      description: Lista detalhada dos itens que compõem o valor total do plano
    description:
      type: string
      nullable: true
      example: "Plano residencial de ultra velocidade com Wi-Fi 6 incluso"
    svaIncluded:
      type: string
      nullable: true
      example: "Paramount+, Noggin"
    suspensionDays:
      type: integer
      default: 5
      example: 5
    alwaysIssueNfcom:
      type: boolean
      default: false
      example: false
    active:
      type: boolean
      default: true
      example: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
      nullable: true

PlanCreateRequest:
  type: object
  description: Parâmetros para criação de novo plano
  required:
    - name
    - downloadSpeed
    - uploadSpeed
    - price
  properties:
    name:
      type: string
      example: "Fibra Turbo 500 Mega"
    downloadSpeed:
      type: integer
      minimum: 1
      example: 500
    uploadSpeed:
      type: integer
      minimum: 1
      example: 250
    price:
      type: number
      format: double
      minimum: 0.01
      example: 99.90
    compositionItems:
      type: array
      items:
        $ref: '#/PlanCompositionItemDto'
      description: Itens que compõem o plano (soma deve ser igual a price; se omitido, 100% assume SCM)
    description:
      type: string
      nullable: true
      example: "Plano residencial de ultra velocidade"
    svaIncluded:
      type: string
      nullable: true
    suspensionDays:
      type: integer
      default: 5
      example: 5
    alwaysIssueNfcom:
      type: boolean
      default: false
    active:
      type: boolean
      default: true

PlanUpdateRequest:
  type: object
  description: Parâmetros para atualização de plano existente
  required:
    - name
    - downloadSpeed
    - uploadSpeed
    - price
  properties:
    name:
      type: string
      example: "Fibra Turbo 600 Mega"
    downloadSpeed:
      type: integer
      minimum: 1
      example: 600
    uploadSpeed:
      type: integer
      minimum: 1
      example: 300
    price:
      type: number
      format: double
      minimum: 0.01
      example: 109.90
    compositionItems:
      type: array
      items:
        $ref: '#/PlanCompositionItemDto'
      description: Itens que compõem o plano (soma deve ser igual a price; se omitido, 100% assume SCM)
    description:
      type: string
      nullable: true
    svaIncluded:
      type: string
      nullable: true
    suspensionDays:
      type: integer
      default: 5
    alwaysIssueNfcom:
      type: boolean
      default: false
    active:
      type: boolean
      default: true

