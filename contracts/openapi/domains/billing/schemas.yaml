# Schemas do Domínio de Faturamento e Cobrança

InvoiceStatus:
  type: string
  enum:
    - PENDING
    - PAID
    - CANCELLED
    - OVERDUE
  description: Situação cadastral e financeira da fatura.

InvoiceCompositionItemDto:
  type: object
  description: Item individual da composição financeira e tributária da fatura (snapshot do plano no momento da emissão)
  required:
    - name
    - category
    - amount
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    name:
      type: string
      example: "Conectividade Fibra Óptica SCM"
    category:
      $ref: '../plans/schemas.yaml#/PlanCompositionCategory'
    amount:
      type: number
      format: double
      example: 59.90
    fiscalCode:
      type: string
      nullable: true
      example: "5307"

InvoiceResponse:
  type: object
  required:
    - id
    - contractId
    - customerId
    - amount
    - dueDate
    - status
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    contractId:
      $ref: '../../components/common.yaml#/UUIDv7'
    customerId:
      $ref: '../../components/common.yaml#/UUIDv7'
    amount:
      type: number
      format: double
      description: Valor principal da fatura em reais.
      example: 99.90
    scmAmount:
      type: number
      format: double
      nullable: true
      description: Parcela SCM tributável na NFCom Modelo 62 em reais.
      example: 59.90
    svaAmount:
      type: number
      format: double
      nullable: true
      description: Parcela total de Locação e SVAs fora da base ICMS da NFCom em reais.
      example: 40.00
    compositionItems:
      type: array
      items:
        $ref: '#/InvoiceCompositionItemDto'
      description: Detalhamento de todos os itens (SCM, Locação, SVAs) que compõem a fatura.
    discountAmount:
      type: number
      format: double
      nullable: true
      example: 0.00
    penaltyAmount:
      type: number
      format: double
      nullable: true
      example: 2.00
    interestAmount:
      type: number
      format: double
      nullable: true
      example: 1.50
    dueDate:
      type: string
      format: date
      description: Data de vencimento da fatura.
      example: "2026-09-15"
    status:
      $ref: '#/InvoiceStatus'
    pixQrCodeUrl:
      type: string
      format: uri
      nullable: true
      description: Imagem do QR Code PIX Dinâmico gerado pelo Gateway.
    pixCopiaECola:
      type: string
      nullable: true
      description: String EMV do PIX Copia-e-Cola para pagamento no app bancário.
      example: "00020101021226830014br.gov.bcb.pix2561qrcodes.isperp.dev/pix/..."
    barcode:
      type: string
      nullable: true
      description: Código de barras numérico para boletos.
      example: "23793.38128 60000.000003 01000.644201 1 98450000009990"
    digitableLine:
      type: string
      nullable: true
      description: Linha digitável formatada do boleto bancário.
    paidAt:
      type: string
      format: date-time
      nullable: true
      description: Timestamp do recebimento e liquidação.
    paidAmount:
      type: number
      format: double
      nullable: true
      description: Valor total efetivamente recebido.
      example: 99.90
    paymentMethod:
      type: string
      nullable: true
      description: Meio de pagamento utilizado (PIX, BOLETO, CARTAO, DINHEIRO).
      example: "PIX"
    pdfUrl:
      type: string
      format: uri
      nullable: true
      description: Link para download do espelho da fatura em PDF.

PayInvoiceRequest:
  type: object
  properties:
    paidAmount:
      type: number
      format: double
      nullable: true
      description: Valor recebido. Se omitido, assume o valor nominal da fatura.
      example: 99.90
    paymentMethod:
      type: string
      default: "PIX"
      description: Meio de liquidação (PIX, DINHEIRO, TRANSFERENCIA_BANCARIA, CARTAO_CREDITO).
      example: "PIX"

TriggerRecurringBillingResponse:
  type: object
  required:
    - message
  properties:
    message:
      type: string
      example: "Rotina de faturamento recorrente executada com sucesso"

DunningProcessResponse:
  type: object
  required:
    - success
    - suspendedCount
    - processedAt
  properties:
    success:
      type: boolean
      example: true
    suspendedCount:
      type: integer
      example: 12
    processedAt:
      type: string
      example: "2026-09-07T18:00:00"

CrossCreditRebalanceResponse:
  type: object
  required:
    - success
    - message
  properties:
    success:
      type: boolean
      example: true
    message:
      type: string
      example: "Compensação cruzada realizada com sucesso e avisos fixos registrados."

UnblockEvaluationResultResponse:
  type: object
  required:
    - granted
    - message
  properties:
    granted:
      type: boolean
      example: true
    message:
      type: string
      example: "Desbloqueio temporário de 48h concedido com sucesso."
    unblockType:
      type: string
      nullable: true
      example: "BOT_AUTO"
    expiresAt:
      type: string
      format: date-time
      nullable: true

NotificationDunningStage:
  type: string
  enum:
    - D_MINUS_3
    - D_ZERO
    - D_PLUS_5_ANATEL_NOTICE
    - PAYMENT_CONFIRMED
  description: Marco da régua ativa de notificação omnichannel (D-3, D0, D+5 Aviso Prévio RGC Anatel e Confirmação de Pagamento).

BillingNotificationDispatchResponse:
  type: object
  required:
    - id
    - invoiceId
    - contractId
    - customerId
    - stage
    - channel
    - recipient
    - messagePreview
    - deliveryStatus
    - dispatchedAt
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    invoiceId:
      $ref: '../../components/common.yaml#/UUIDv7'
    contractId:
      $ref: '../../components/common.yaml#/UUIDv7'
    customerId:
      $ref: '../../components/common.yaml#/UUIDv7'
    customerName:
      type: string
      nullable: true
      example: "Maria Oliveira"
    stage:
      $ref: '#/NotificationDunningStage'
    channel:
      type: string
      example: "WHATSAPP"
    recipient:
      type: string
      example: "5593991234567"
    messagePreview:
      type: string
      example: "Olá Maria Oliveira! Sua fatura no valor de R$ 99,90 vence em 3 dias. Pague via PIX Copia-e-Cola: 000201..."
    deliveryStatus:
      type: string
      example: "SENT"
    dispatchedAt:
      type: string
      format: date-time

BillingNotificationSweepResponse:
  type: object
  required:
    - totalDispatched
    - dMinus3Count
    - dZeroCount
    - dPlus5AnatelCount
    - processedAt
    - dispatches
  properties:
    totalDispatched:
      type: integer
      example: 18
    dMinus3Count:
      type: integer
      example: 9
    dZeroCount:
      type: integer
      example: 6
    dPlus5AnatelCount:
      type: integer
      example: 3
    processedAt:
      type: string
      format: date-time
    dispatches:
      type: array
      items:
        $ref: '#/BillingNotificationDispatchResponse'

