# Endpoints do Domínio de Faturamento e Cobrança

/invoices:
  get:
    tags:
      - Invoices
    summary: Listar faturas
    operationId: getAllInvoices
    description: Retorna o histórico de faturas geradas com filtro opcional por status.
    parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: './schemas.yaml#/InvoiceStatus'
    responses:
      '200':
        description: Lista de faturas retornada com sucesso.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yaml#/InvoiceResponse'
      '401':
        description: Não autenticado.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

/invoices/{id}:
  get:
    tags:
      - Invoices
    summary: Obter detalhes da fatura
    operationId: getInvoiceById
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../../components/common.yaml#/UUIDv7'
    responses:
      '200':
        description: Fatura encontrada.
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/InvoiceResponse'
      '404':
        description: Fatura não encontrada.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

/invoices/customer/{customerId}:
  get:
    tags:
      - Invoices
    summary: Listar faturas de um cliente
    operationId: getInvoicesByCustomerId
    parameters:
      - name: customerId
        in: path
        required: true
        schema:
          $ref: '../../components/common.yaml#/UUIDv7'
    responses:
      '200':
        description: Faturas do cliente.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yaml#/InvoiceResponse'
      '404':
        description: Cliente não encontrado.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

/invoices/contract/{contractId}:
  get:
    tags:
      - Invoices
    summary: Listar faturas de um contrato
    operationId: getInvoicesByContractId
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          $ref: '../../components/common.yaml#/UUIDv7'
    responses:
      '200':
        description: Faturas do contrato retornadas com sucesso.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yaml#/InvoiceResponse'
      '404':
        description: Contrato não encontrado.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

/invoices/generate/contract/{contractId}:
  post:
    tags:
      - Invoices
    summary: Gerar fatura avulsa para um contrato
    operationId: generateInvoiceManually
    parameters:
      - name: contractId
        in: path
        required: true
        schema:
          $ref: '../../components/common.yaml#/UUIDv7'
      - name: dueDate
        in: query
        required: false
        description: Data de vencimento da fatura gerada (padrão é D+10 dias).
        schema:
          type: string
          format: date
    responses:
      '201':
        description: Fatura gerada com sucesso.
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/InvoiceResponse'
      '400':
        description: Parâmetros inválidos ou erro na geração.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'
      '404':
        description: Contrato não encontrado.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

/invoices/{id}/pay:
  post:
    tags:
      - Invoices
    summary: Baixar pagamento da fatura
    operationId: payInvoice
    description: Liquida a fatura informando o meio de pagamento e valor recebido.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../../components/common.yaml#/UUIDv7'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/PayInvoiceRequest'
    responses:
      '200':
        description: Fatura baixada com sucesso.
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/InvoiceResponse'
      '400':
        description: Erro na liquidação da fatura.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

/invoices/{id}/cancel:
  post:
    tags:
      - Invoices
    summary: Cancelar fatura
    operationId: cancelInvoice
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../../components/common.yaml#/UUIDv7'
    responses:
      '200':
        description: Fatura cancelada com sucesso.
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/InvoiceResponse'
      '400':
        description: Fatura já liquidada ou em estado não cancelável.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

/invoices/trigger-recurring-billing:
  post:
    tags:
      - Invoices
    summary: Disparar rotina de faturamento recorrente
    operationId: triggerRecurringBilling
    description: Executa a geração de faturas do ciclo mensal para todos os contratos ativos.
    responses:
      '200':
        description: Rotina disparada com sucesso.
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/TriggerRecurringBillingResponse'
      '400':
        description: Erro nos parâmetros da rotina recorrente.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'
      '500':
        description: Erro interno no processamento do lote.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'
