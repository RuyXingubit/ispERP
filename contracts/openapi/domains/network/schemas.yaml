# ==========================================
# IPAM (IP Address Management)
# ==========================================

IpamRir:
  type: string
  enum:
    - REGISTRO_BR
    - LACNIC
    - ARIN
    - RIPE
    - APNIC
    - AFRINIC

IpamIpVersion:
  type: string
  enum:
    - IPV4
    - IPV6

IpamSubnetStatus:
  type: string
  enum:
    - ACTIVE
    - RESERVED
    - DEPRECATED

IpamSubnetCategory:
  type: string
  enum:
    - CUSTOMER_ACCESS
    - CGNAT
    - MANAGEMENT
    - INFRASTRUCTURE
    - PTP
    - LOOPBACK

IpamAddressStatus:
  type: string
  enum:
    - AVAILABLE
    - ALLOCATED
    - RESERVED
    - DHCP_POOL

IpamAssignedToType:
  type: string
  enum:
    - CONTRACT
    - NETWORK_DEVICE
    - INFRASTRUCTURE
    - CGNAT_POOL
    - ROUTED_SUBNET

IpamAsnRequest:
  type: object
  required:
    - asn
    - name
  properties:
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    asn:
      type: integer
      format: int64
      example: 265000
    name:
      type: string
      example: "NEXUS FIBRA TELECOMUNICACOES LTDA"
    rir:
      $ref: '#/IpamRir'
    description:
      type: string
      nullable: true

IpamAsnResponse:
  type: object
  required:
    - id
    - asn
    - name
    - rir
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    asn:
      type: integer
      format: int64
    name:
      type: string
    rir:
      $ref: '#/IpamRir'
    description:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

IpamVrfRequest:
  type: object
  required:
    - name
  properties:
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    name:
      type: string
      example: "VRF-CLIENTES-B2C"
    rd:
      type: string
      nullable: true
      example: "265000:100"
    description:
      type: string
      nullable: true
    isDefault:
      type: boolean
      default: false

IpamVrfResponse:
  type: object
  required:
    - id
    - name
    - isDefault
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    name:
      type: string
    rd:
      type: string
      nullable: true
    description:
      type: string
      nullable: true
    isDefault:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

IpamSubnetRequest:
  type: object
  required:
    - cidr
  properties:
    parentId:
      $ref: '../../components/common.yaml#/UUIDv7'
    vrfId:
      $ref: '../../components/common.yaml#/UUIDv7'
    asnId:
      $ref: '../../components/common.yaml#/UUIDv7'
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    cidr:
      type: string
      example: "200.150.10.0/24"
    isPool:
      type: boolean
      default: false
    poolName:
      type: string
      nullable: true
    status:
      $ref: '#/IpamSubnetStatus'
    category:
      $ref: '#/IpamSubnetCategory'
    description:
      type: string
      nullable: true

IpamSubnetResponse:
  type: object
  required:
    - id
    - cidr
    - ipVersion
    - networkAddress
    - prefixLength
    - totalHosts
    - allocatedHosts
    - isPool
    - status
    - category
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    parentId:
      $ref: '../../components/common.yaml#/UUIDv7'
    vrfId:
      $ref: '../../components/common.yaml#/UUIDv7'
    vrfName:
      type: string
      nullable: true
    asnId:
      $ref: '../../components/common.yaml#/UUIDv7'
    asnNumber:
      type: integer
      format: int64
      nullable: true
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    cidr:
      type: string
    ipVersion:
      $ref: '#/IpamIpVersion'
    networkAddress:
      type: string
    broadcastAddress:
      type: string
      nullable: true
    prefixLength:
      type: integer
    totalHosts:
      type: integer
      format: int64
    allocatedHosts:
      type: integer
      format: int64
    utilizationPercentage:
      type: number
      format: double
      nullable: true
    isPool:
      type: boolean
    poolName:
      type: string
      nullable: true
    status:
      $ref: '#/IpamSubnetStatus'
    category:
      $ref: '#/IpamSubnetCategory'
    description:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

SubnetCalculationResult:
  type: object
  required:
    - cidr
    - ipVersion
    - networkAddress
    - netmask
    - firstUsableIp
    - lastUsableIp
    - prefixLength
    - totalHosts
    - usableHosts
  properties:
    cidr:
      type: string
    ipVersion:
      $ref: '#/IpamIpVersion'
    networkAddress:
      type: string
    broadcastAddress:
      type: string
      nullable: true
    netmask:
      type: string
    wildcardMask:
      type: string
      nullable: true
    firstUsableIp:
      type: string
    lastUsableIp:
      type: string
    prefixLength:
      type: integer
    totalHosts:
      type: integer
      format: int64
    usableHosts:
      type: integer
      format: int64

IpamSplitRequest:
  type: object
  required:
    - subnetId
    - targetPrefixLength
  properties:
    subnetId:
      $ref: '../../components/common.yaml#/UUIDv7'
    targetPrefixLength:
      type: integer
      example: 28
    createSubnets:
      type: boolean
      default: false

IpamSplitResponse:
  type: object
  required:
    - parentSubnetId
    - parentCidr
    - targetPrefixLength
    - totalSubnetsGenerated
    - generatedSubnets
  properties:
    parentSubnetId:
      $ref: '../../components/common.yaml#/UUIDv7'
    parentCidr:
      type: string
    targetPrefixLength:
      type: integer
    totalSubnetsGenerated:
      type: integer
    generatedSubnets:
      type: array
      items:
        $ref: '#/SubnetCalculationResult'
    persistedSubnets:
      type: array
      items:
        $ref: '#/IpamSubnetResponse'

IpamIpAddressRequest:
  type: object
  required:
    - subnetId
    - ipAddress
  properties:
    subnetId:
      $ref: '../../components/common.yaml#/UUIDv7'
    ipAddress:
      type: string
      example: "200.150.10.5"
    status:
      $ref: '#/IpamAddressStatus'
    assignedToType:
      $ref: '#/IpamAssignedToType'
    assignedToId:
      $ref: '../../components/common.yaml#/UUIDv7'
    dnsName:
      type: string
      nullable: true
    description:
      type: string
      nullable: true

IpamIpAddressResponse:
  type: object
  required:
    - id
    - subnetId
    - subnetCidr
    - ipAddress
    - status
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    subnetId:
      $ref: '../../components/common.yaml#/UUIDv7'
    subnetCidr:
      type: string
    ipAddress:
      type: string
    status:
      $ref: '#/IpamAddressStatus'
    assignedToType:
      $ref: '#/IpamAssignedToType'
    assignedToId:
      $ref: '../../components/common.yaml#/UUIDv7'
    assignedToLabel:
      type: string
      nullable: true
    dnsName:
      type: string
      nullable: true
    description:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

IpamNextAvailableResponse:
  type: object
  properties:
    nextAvailableIp:
      type: string
