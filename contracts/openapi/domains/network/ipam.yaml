# Endpoints de Gestão de Endereçamento IP (IPAM), Sub-redes, ASNs, VRFs e Inventário

/ipam/asns:
  get:
    tags:
      - Ipam
    summary: Lista todos os ASNs cadastrados
    operationId: listIpamAsns
    responses:
      '200':
        description: Lista de ASNs cadastrados.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yaml#/IpamAsnResponse'

  post:
    tags:
      - Ipam
    summary: Cadastra um novo ASN
    operationId: createIpamAsn
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/IpamAsnRequest'
    responses:
      '201':
        description: ASN cadastrado com sucesso.
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/IpamAsnResponse'
      '400':
        description: Dados inválidos.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

/ipam/asns/{id}:
  get:
    tags:
      - Ipam
    summary: Obtém detalhes de um ASN por ID
    operationId: getIpamAsnById
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../../components/common.yaml#/UUIDv7'
    responses:
      '200':
        description: ASN localizado.
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/IpamAsnResponse'
      '404':
        description: ASN não encontrado.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

  put:
    tags:
      - Ipam
    summary: Atualiza dados de um ASN
    operationId: updateIpamAsn
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../../components/common.yaml#/UUIDv7'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/IpamAsnRequest'
    responses:
      '200':
        description: ASN atualizado com sucesso.
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/IpamAsnResponse'
      '404':
        description: ASN não encontrado.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

  delete:
    tags:
      - Ipam
    summary: Remove um ASN
    operationId: deleteIpamAsn
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../../components/common.yaml#/UUIDv7'
    responses:
      '204':
        description: ASN removido com sucesso.
      '404':
        description: ASN não encontrado.
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

