SaleStatusEnum:
  type: string
  enum:
    - SUBMITTED
    - PENDING_PAYMENT_SIGNATURE
    - PROCESSED
    - CANCELED
  description: Estado do fluxo da venda / proposta comercial

SaleResponse:
  type: object
  description: Dados da venda / proposta comercial registrada
  required:
    - id
    - planId
    - customerName
    - customerCpf
    - customerPhone
    - installationAddress
    - city
    - state
    - zipCode
    - preferredDueDate
    - notificationChannel
    - status
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      example: "01944883-9b48-7b89-9a2c-15a4b7f83b2c"
    planId:
      type: string
      format: uuid
      example: "01944883-9b48-7b89-9a2c-15a4b7f83b2a"
    customerName:
      type: string
      example: "Mariana Souza"
    customerCpf:
      type: string
      example: "987.654.321-00"
    customerEmail:
      type: string
      format: email
      nullable: true
      example: "mariana.souza@email.com"
    customerPhone:
      type: string
      example: "(93) 98400-1122"
    installationAddress:
      type: string
      example: "Rua das Acácias, 45"
    city:
      type: string
      example: "Altamira"
    state:
      type: string
      example: "PA"
    zipCode:
      type: string
      example: "68370-000"
    preferredDueDate:
      type: integer
      example: 10
    notificationChannel:
      type: string
      example: "WHATSAPP"
    sellerName:
      type: string
      nullable: true
      example: "Vendedor Roberto"
    ctoId:
      type: string
      format: uuid
      nullable: true
      description: ID da CTO vinculada/reservada na viabilidade comercial
    ctoPortNumber:
      type: integer
      nullable: true
      example: 3
      description: Número da porta reservada na CTO
    latitude:
      type: number
      format: double
      nullable: true
      example: -3.2041
    longitude:
      type: number
      format: double
      nullable: true
      example: -52.2098
    preferredScheduleDate:
      type: string
      format: date
      nullable: true
      example: "2026-10-18"
    preferredSchedulePeriod:
      type: string
      nullable: true
      example: "MANHA"
    status:
      $ref: '#/SaleStatusEnum'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
      nullable: true

CreateSaleRequest:
  type: object
  description: Parâmetros para submissão de nova proposta de venda
  required:
    - planId
    - customerName
    - customerCpf
    - customerPhone
    - installationAddress
    - city
    - state
    - zipCode
  properties:
    planId:
      type: string
      format: uuid
      example: "01944883-9b48-7b89-9a2c-15a4b7f83b2a"
    customerName:
      type: string
      example: "Mariana Souza"
    customerCpf:
      type: string
      example: "987.654.321-00"
    customerEmail:
      type: string
      format: email
      nullable: true
      example: "mariana.souza@email.com"
    customerPhone:
      type: string
      example: "(93) 98400-1122"
    installationAddress:
      type: string
      example: "Rua das Acácias, 45"
    city:
      type: string
      example: "Altamira"
    state:
      type: string
      example: "PA"
    zipCode:
      type: string
      example: "68370-000"
    preferredDueDate:
      type: integer
      default: 10
      example: 10
    notificationChannel:
      type: string
      default: "WHATSAPP"
      example: "WHATSAPP"
    sellerName:
      type: string
      nullable: true
      example: "Vendedor Roberto"
    ctoId:
      type: string
      format: uuid
      nullable: true
      description: ID da CTO selecionada na análise de viabilidade FTTH
    ctoPortNumber:
      type: integer
      nullable: true
      description: Número da porta pré-selecionada na CTO (se omitido, reserva a primeira porta LIVRE)
    latitude:
      type: number
      format: double
      nullable: true
      description: Latitude GPS do imóvel do assinante
    longitude:
      type: number
      format: double
      nullable: true
      description: Longitude GPS do imóvel do assinante
    preferredScheduleDate:
      type: string
      format: date
      nullable: true
      description: Data preferencial de instalação selecionada na venda
    preferredSchedulePeriod:
      type: string
      nullable: true
      example: "MANHA"
      description: Turno preferencial de instalação (MANHA ou TARDE)
