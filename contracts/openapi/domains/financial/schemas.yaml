      nullable: true

WorkOrderFeeWaiverRequest:
  type: object
  required:
    - workOrderId
    - waiverReason
  properties:
    workOrderId:
      type: string
      format: uuid
    waiverReason:
      type: string
      example: "Cliente ameaçou cancelar por lentidão prévia não solucionada"

WorkOrderFeeAuditRequest:
  type: object
  required:
    - approved
  properties:
    approved:
      type: boolean
    notes:
      type: string
      nullable: true
