# ==============================================================================
# Esquemas do Domínio Fiscal, NFCom (Mod. 62) e Transições de Regime (ispERP)
# ==============================================================================

FiscalRegime:
  type: string
  description: Regime tributário aplicável ao provedor de telecomunicações
  enum:
    - SIMPLES_NACIONAL
    - LUCRO_PRESUMIDO
    - LUCRO_REAL

FiscalEnvironment:
  type: string
  description: Ambiente de autorização SEFAZ da Nota Fiscal
  enum:
    - HOMOLOGACAO
    - PRODUCAO

FiscalRegimeTransitionStatus:
  type: string
  description: Status do agendamento de transição de regime tributário
  enum:
    - SCHEDULED
    - APPLIED
    - CANCELLED

# ------------------------------------------------------------------------------
# Empresa Fiscal & Certificado Digital A1
# ------------------------------------------------------------------------------
FiscalCompanyResponse:
  type: object
  description: Dados cadastrais e alíquotas fiscais ativas da empresa
  required:
    - id
    - cnpj
    - razaoSocial
    - inscricaoEstadual
    - cnaePrincipal
    - regimeTributario
    - logradouro
    - numero
    - bairro
    - cidade
    - uf
    - cep
    - codigoIbge
    - nfcomAmbiente
    - nfcomSerie
    - nfcomProximoNumero
    - hasCertificate
    - fiscalConfirmed
    - isActive
  properties:
    id:
      type: string
      format: uuid
      example: "01912e73-b789-7000-8000-000000000001"
    cnpj:
      type: string
      example: "12.345.678/0001-90"
    razaoSocial:
      type: string
      example: "Nexus Fibra Telecomunicações LTDA"
    nomeFantasia:
      type: string
      nullable: true
      example: "Nexus Fibra"
    inscricaoEstadual:
      type: string
      example: "15.123.456-7"
    inscricaoMunicipal:
      type: string
      nullable: true
    cnaePrincipal:
      type: string
      example: "6110-8/03"
    regimeTributario:
      $ref: '#/FiscalRegime'
    aliquotaIcms:
      type: number
      format: double
      example: 0.00
    aliquotaFust:
      type: number
      format: double
      example: 0.65
    aliquotaFunttel:
      type: number
      format: double
      example: 0.50
    aliquotaPis:
      type: number
      format: double
      example: 0.65
    aliquotaCofins:
      type: number
      format: double
      example: 3.00
    logradouro:
      type: string
      example: "Av. Principal"
    numero:
      type: string
      example: "100"
    complemento:
      type: string
      nullable: true
    bairro:
      type: string
      example: "Centro"
    cidade:
      type: string
      example: "Altamira"
    uf:
      type: string
      example: "PA"
    cep:
      type: string
      example: "68370-000"
    codigoIbge:
      type: string
      example: "1500602"
    telefone:
      type: string
      nullable: true
    emailFiscal:
      type: string
      nullable: true
      example: "fiscal@nexusfibra.com.br"
    nfcomAmbiente:
      $ref: '#/FiscalEnvironment'
    nfcomSerie:
      type: string
      example: "1"
    nfcomProximoNumero:
      type: integer
      example: 101
    hasCertificate:
      type: boolean
      example: true
    certificateExpiresAt:
      type: string
      format: date-time
      nullable: true
    accountingName:
      type: string
      nullable: true
      example: "Contabilidade Express"
    accountingEmails:
      type: string
      nullable: true
      example: "contabil@express.com.br"
    accountingSendDay:
      type: integer
      example: 5
    accountingAutoSend:
      type: boolean
      example: true
    accountingLastSentAt:
      type: string
      format: date-time
      nullable: true
    fiscalConfirmed:
      type: boolean
      example: true
    fiscalConfirmedAt:
      type: string
      format: date-time
      nullable: true
    isActive:
      type: boolean
      example: true
    createdAt:
      type: string
      format: date-time
      nullable: true
    updatedAt:
      type: string
      format: date-time
      nullable: true

