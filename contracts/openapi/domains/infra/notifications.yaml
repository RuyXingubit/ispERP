# Endpoints de Configuração de Provedores de Notificação (WhatsApp/SMS)

/notifications/configs:
  get:
    tags:
      - NotificationConfigs
    summary: Listar todas as configurações de canais de notificação
    operationId: listNotificationConfigs
    responses:
      '200':
        description: Lista de configurações
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yaml#/NotificationConfigResponse'
  post:
    tags:
      - NotificationConfigs
    summary: Cadastrar nova configuração de canal de notificação
    operationId: createNotificationConfig
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/NotificationConfigSaveRequest'
    responses:
      '200':
        description: Configuração criada com sucesso
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/NotificationConfigResponse'

/notifications/configs/{id}:
  put:
    tags:
      - NotificationConfigs
    summary: Atualizar configuração existente de canal de notificação
    operationId: updateNotificationConfig
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '../../components/common.yaml#/UUIDv7'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/NotificationConfigSaveRequest'
    responses:
      '200':
        description: Configuração atualizada com sucesso
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/NotificationConfigResponse'
