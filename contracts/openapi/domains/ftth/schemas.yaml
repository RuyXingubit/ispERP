      type: string
      nullable: true
      example: "João Silva"
    pppoeUser:
      type: string
      nullable: true
      example: "joao.silva"
    notes:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time

FtthCtoRequest:
  type: object
  required:
    - name
    - latitude
    - longitude
  properties:
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
