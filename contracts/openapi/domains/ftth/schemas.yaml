    - distanceMeters
    - freePorts
    - hasCapacity
  properties:
    cto:
      $ref: '#/FtthCtoResponse'
    distanceMeters:
      type: number
      format: double
      example: 65.4
    freePorts:
      type: integer
      example: 5
    hasCapacity:
      type: boolean
      example: true

FtthFeasibilityRequest:
  type: object
  required:
