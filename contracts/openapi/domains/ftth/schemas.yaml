      $ref: '../../components/common.yaml#/UUIDv7'
    latitude:
      type: number
      format: double
      example: -23.550520
    longitude:
      type: number
      format: double
      example: -46.633308
    totalPorts:
      type: integer
      default: 16
      example: 16
    splitterType:
      type: string
      default: "BALANCED_1_16"
      example: "BALANCED_1_16"
    status:
      type: string
      default: "ATIVA"
      example: "ATIVA"
    description:
      type: string
      nullable: true
      example: "CTO de atendimento residencial"

FtthCtoResponse:
