    onuSerial:
      type: string
      nullable: true
      example: "HWTC12345678"
    onuMac:
      type: string
      nullable: true
      example: "AA:BB:CC:DD:EE:FF"
    customerId:
      $ref: '../../components/common.yaml#/UUIDv7'
