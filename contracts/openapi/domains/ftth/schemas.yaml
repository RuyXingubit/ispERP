FtthIncidentDispatchRequest:
  type: object
  properties:
    technicianId:
      $ref: '../../components/common.yaml#/UUIDv7'
    notes:
      type: string
      nullable: true
      example: "Técnico acionado com máquina de fusão para averiguação no poste 9021"

FtthIncidentResolveRequest:
  type: object
  required:
    - rootCauseNotes
  properties:
    rootCauseNotes:
      type: string
      example: "Cabo de distribuição rompido por caminhão baú. Feito refazimento de 4 fusões na CEO-01."

FtthIncidentResponse:
  type: object
  required:
    - id
    - incidentType
    - incidentTypeDescription
    - severity
    - status
    - title
    - affectedCustomersCount
    - detectedAt
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    networkDeviceId:
      $ref: '../../components/common.yaml#/UUIDv7'
    oltName:
      type: string
      nullable: true
      example: "OLT-HUAWEI-5608T"
    oltPonPortId:
      $ref: '../../components/common.yaml#/UUIDv7'
    ponName:
      type: string
      nullable: true
      example: "GPON 0/1/4"
    incidentType:
      $ref: '#/IncidentType'
    incidentTypeDescription:
      type: string
      example: "Rompimento Provável de Fibra Óptica"
    severity:
      $ref: '#/IncidentSeverity'
    status:
      $ref: '#/IncidentStatus'
    title:
      type: string
      example: "Alarme Massivo PON 0/1/4: 24 ONUs sem sinal (LOS)"
    description:
      type: string
      nullable: true
      example: "Queda simultânea de 24 ONUs conectadas ao cabo CABO-TRONCAL-01"
    affectedCustomersCount:
      type: integer
      example: 24
    affectedCtosIds:
      type: string
      nullable: true
    affectedCtoNames:
      type: array
      nullable: true
      items:
        type: string
    affectedCableId:
      $ref: '../../components/common.yaml#/UUIDv7'
    affectedCableName:
      type: string
      nullable: true
      example: "CABO-TRONCAL-01"
    estimatedCutLatitude:
      type: number
      format: double
      nullable: true
      example: -23.551200
    estimatedCutLongitude:
      type: number
      format: double
      nullable: true
      example: -46.634100
    estimatedCutDetails:
      type: string
      nullable: true
      example: "Vértice de convergência entre CTO-01 e CTO-04"
    workOrderId:
      $ref: '../../components/common.yaml#/UUIDv7'
    workOrderProtocol:
      type: string
      nullable: true
      example: "OS-2026-00912"
    detectedAt:
      type: string
      format: date-time
    dispatchedAt:
      type: string
      format: date-time
      nullable: true
    resolvedAt:
      type: string
      format: date-time
      nullable: true
    rootCauseNotes:
      type: string
      nullable: true

NocMonitoringSummaryResponse:
  type: object
  required:
    - totalOlts
    - totalPonPorts
    - activePonPorts
    - totalOnus
    - onlineOnus
    - losOnus
    - dyingGaspOnus
    - offlineOnus
    - globalHealthPercentage
    - activeIncidentsCount
    - criticalIncidentsCount
    - activeIncidents
  properties:
    totalOlts:
      type: integer
      example: 3
    totalPonPorts:
      type: integer
      example: 24
    activePonPorts:
      type: integer
      example: 20
    totalOnus:
      type: integer
      example: 1250
    onlineOnus:
      type: integer
      example: 1210
    losOnus:
      type: integer
      example: 35
    dyingGaspOnus:
      type: integer
      example: 5
    offlineOnus:
      type: integer
      example: 40
    globalHealthPercentage:
      type: number
      format: double
      example: 96.8
    activeIncidentsCount:
      type: integer
      example: 2
    criticalIncidentsCount:
      type: integer
      example: 1
    activeIncidents:
      type: array
      items:
        $ref: '#/FtthIncidentResponse'

InstallationMaterialDemandResponse:
  type: object
  required:
    - id
    - workOrderId
    - contractId
    - estimatedDropMeters
    - onuModelRequired
    - fastConnectorsCount
    - ptoRosetteCount
    - status
    - createdAt
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    workOrderId:
      $ref: '../../components/common.yaml#/UUIDv7'
    contractId:
      $ref: '../../components/common.yaml#/UUIDv7'
    contractNumber:
      type: string
      nullable: true
      example: "CTR-2026-001"
    customerName:
      type: string
      nullable: true
      example: "João Silva"
    customerPhone:
      type: string
      nullable: true
      example: "(11) 98765-4321"
    customerAddress:
      type: string
      nullable: true
      example: "Rua das Flores, 123"
    customerLatitude:
      type: number
      format: double
      nullable: true
      example: -23.550520
    customerLongitude:
      type: number
      format: double
      nullable: true
      example: -46.633308
    ctoId:
      $ref: '../../components/common.yaml#/UUIDv7'
    ctoName:
      type: string
      nullable: true
      example: "CTO-CENTRO-01"
    ctoLatitude:
      type: number
      format: double
      nullable: true
      example: -23.550400
    ctoLongitude:
      type: number
      format: double
      nullable: true
      example: -46.633200
    ctoPortNumber:
      type: integer
      nullable: true
      example: 2
    estimatedDropMeters:
      type: integer
      example: 85
    onuModelRequired:
      type: string
      example: "ONU GPON Wi-Fi AC 1200"
    fastConnectorsCount:
      type: integer
      example: 2
    ptoRosetteCount:
      type: integer
      example: 1
    status:
      $ref: '#/MaterialDemandStatus'
    allocatedWarehouseId:
      $ref: '../../components/common.yaml#/UUIDv7'
    allocatedWarehouseName:
      type: string
      nullable: true
      example: "Veículo 04 - Fiat Strada"
    allocatedTechnicianName:
      type: string
      nullable: true
      example: "Marcos Vinicius"
    workOrderType:
      type: string
      nullable: true
      example: "INSTALACAO"
    createdAt:
      type: string
      format: date-time

TechnicianDispatchCandidateResponse:
  type: object
  required:
    - technicianId
    - technicianName
    - hasCompleteKit
    - hasOnu
    - hasDropCable
    - hasConnectors
    - dropCableBalanceMeters
    - recommendedScore
  properties:
    technicianId:
      $ref: '../../components/common.yaml#/UUIDv7'
    technicianName:
      type: string
      example: "Carlos Oliveira"
    warehouseId:
      $ref: '../../components/common.yaml#/UUIDv7'
    vehicleWarehouseName:
      type: string
      nullable: true
      example: "Veículo 02 - Renault Kangoo"
    hasCompleteKit:
      type: boolean
      example: true
    hasOnu:
      type: boolean
      example: true
    hasDropCable:
      type: boolean
      example: true
    hasConnectors:
      type: boolean
      example: true
    dropCableBalanceMeters:
      type: integer
      example: 320
    currentLatitude:
      type: number
      format: double
      nullable: true
      example: -23.552000
    currentLongitude:
      type: number
      format: double
      nullable: true
      example: -46.635000
    distanceKmToCustomer:
      type: number
      format: double
      nullable: true
      example: 1.45
    lastServiceAddress:
      type: string
      nullable: true
      example: "Rua Augusta, 450"
    recommendedScore:
      type: number
      format: double
      example: 94.5
