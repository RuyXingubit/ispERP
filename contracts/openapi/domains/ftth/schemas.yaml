# Schemas de FTTH (Topologia, Rastreamento Óptico, Monitoramento NOC e Triagem de Despacho)

FtthCableType:
  type: string
  enum:
    - ALIMENTADOR
    - DISTRIBUICAO
    - DROP
  description: Tipo funcional do cabo óptico na topologia FTTH.

FiberColorStandard:
  type: string
  enum:
    - ABNT_NBR_14106
    - TIA_EIA_598
  description: Padrão de codificação por cores das fibras e tubos loose.

FtthClosureType:
  type: string
  enum:
    - DOMO
    - RETANGULAR
    - SUBTERRANEA
  description: Formato físico e montagem da caixa de emenda óptica (CEO).

FtthSplitterType:
  type: string
  enum:
    - BALANCED_1_2
    - BALANCED_1_4
    - BALANCED_1_8
    - BALANCED_1_16
    - BALANCED_1_32
    - BALANCED_1_64
    - UNBALANCED_95_05
    - UNBALANCED_90_10
    - UNBALANCED_85_15
    - UNBALANCED_80_20
    - UNBALANCED_75_25
    - UNBALANCED_70_30
    - UNBALANCED_60_40
    - UNBALANCED_50_50
  description: Tipo de divisor óptico (balanceado PLC ou desbalanceado FBT em barramento).

FtthPortStatus:
  type: string
  enum:
    - LIVRE
    - OCUPADA
    - RESERVADA
    - DEFEITO
  description: Estado de ocupação da porta de atendimento na CTO.

IncidentType:
  type: string
  enum:
    - FIBER_CUT_PROBABLE
    - POWER_OUTAGE_PROBABLE
    - MASSIVE_LOS_PON
    - CTO_OFFLINE
    - DEGRADED_SIGNAL
  description: Tipo de anomalia ou corte detectado pelo motor de correlação NOC.

IncidentSeverity:
  type: string
  enum:
    - CRITICAL
    - MAJOR
    - WARNING
    - INFO
  description: Criticidade do incidente óptico.

IncidentStatus:
  type: string
  enum:
    - ACTIVE
    - INVESTIGATING
    - DISPATCHED
    - RESOLVED
  description: Ciclo de vida operacional do incidente no NOC.

MaterialDemandStatus:
  type: string
  enum:
    - PENDING_ALLOCATION
    - ALLOCATED_VEHICLE
    - ALLOCATED_CENTRAL
    - CONSUMED
    - CANCELED
  description: Status de reserva e consumo do kit FTTH na O.S.

FtthPopRequest:
  type: object
  required:
    - name
  properties:
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    name:
      type: string
      example: "POP Central Matriz"
    latitude:
      type: number
      format: double
      nullable: true
      example: -23.550520
    longitude:
      type: number
      format: double
      nullable: true
      example: -46.633308
    address:
      type: string
      nullable: true
      example: "Av. Paulista, 1000"
    description:
      type: string
      nullable: true
      example: "Datacenter e OLT principal da sede"

FtthPopResponse:
  type: object
  required:
    - id
    - name
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    name:
      type: string
      example: "POP Central Matriz"
    latitude:
      type: number
      format: double
      nullable: true
      example: -23.550520
    longitude:
      type: number
      format: double
      nullable: true
      example: -46.633308
    address:
      type: string
      nullable: true
      example: "Av. Paulista, 1000"
    description:
      type: string
      nullable: true
      example: "Datacenter e OLT principal da sede"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

FtthPoleRequest:
  type: object
  required:
    - code
    - latitude
    - longitude
  properties:
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    code:
      type: string
      example: "POSTE-CPFL-9021"
    latitude:
      type: number
      format: double
      example: -23.551200
    longitude:
      type: number
      format: double
      example: -46.634100
    poleType:
      type: string
      default: "CONCRETO"
      example: "CONCRETO"
    reservationMeters:
      type: integer
      default: 0
      example: 10
    description:
      type: string
      nullable: true
      example: "Esquina com Rua Bela Cintra"

FtthPoleResponse:
  type: object
  required:
    - id
    - code
    - latitude
    - longitude
    - poleType
    - reservationMeters
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    code:
      type: string
      example: "POSTE-CPFL-9021"
    latitude:
      type: number
      format: double
      example: -23.551200
    longitude:
      type: number
      format: double
      example: -46.634100
    poleType:
      type: string
      example: "CONCRETO"
    reservationMeters:
      type: integer
      example: 10
    description:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

FiberColorInfo:
  type: object
  required:
    - fiberNumber
    - tubeNumber
    - fiberInTubeNumber
    - fiberColorName
    - fiberColorHex
    - tubeColorName
    - tubeColorHex
    - standard
  properties:
    fiberNumber:
      type: integer
      example: 1
    tubeNumber:
      type: integer
      example: 1
    fiberInTubeNumber:
      type: integer
      example: 1
    fiberColorName:
      type: string
      example: "Verde"
    fiberColorHex:
      type: string
      example: "#00AA00"
    tubeColorName:
      type: string
      example: "Verde"
    tubeColorHex:
      type: string
      example: "#00AA00"
    standard:
      $ref: '#/FiberColorStandard'

FtthCableRequest:
  type: object
  required:
    - name
  properties:
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    name:
      type: string
      example: "CABO-TRONCAL-01"
    cableType:
      $ref: '#/FtthCableType'
    fiberCount:
      type: integer
      minimum: 1
      default: 12
      example: 24
    tubeCount:
      type: integer
      minimum: 1
      default: 1
      example: 2
    colorStandard:
      $ref: '#/FiberColorStandard'
    lengthMeters:
      type: number
      format: double
      example: 450.0
    pathCoordinates:
      type: string
      nullable: true
      description: "Coordenadas georreferenciadas do traçado do cabo em formato GeoJSON"
    sourcePopId:
      $ref: '../../components/common.yaml#/UUIDv7'
    sourcePoleId:
      $ref: '../../components/common.yaml#/UUIDv7'
    targetPoleId:
      $ref: '../../components/common.yaml#/UUIDv7'
    attenuationDbPerKm:
      type: number
      format: double
      default: 0.35
      example: 0.35

FtthCableResponse:
  type: object
  required:
    - id
    - name
    - cableType
    - fiberCount
    - tubeCount
    - colorStandard
    - lengthMeters
    - attenuationDbPerKm
    - createdAt
    - updatedAt
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    name:
      type: string
      example: "CABO-TRONCAL-01"
    cableType:
      $ref: '#/FtthCableType'
    fiberCount:
      type: integer
      example: 24
    tubeCount:
      type: integer
      example: 2
    colorStandard:
      $ref: '#/FiberColorStandard'
    lengthMeters:
      type: number
      format: double
      example: 450.0
    pathCoordinates:
      type: string
      nullable: true
    sourcePopId:
      $ref: '../../components/common.yaml#/UUIDv7'
    sourcePoleId:
      $ref: '../../components/common.yaml#/UUIDv7'
    targetPoleId:
      $ref: '../../components/common.yaml#/UUIDv7'
    attenuationDbPerKm:
      type: number
      format: double
      example: 0.35
    fibers:
      type: array
      nullable: true
      items:
        $ref: '#/FiberColorInfo'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

FtthClosureRequest:
  type: object
