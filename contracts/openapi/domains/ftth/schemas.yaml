    - updatedAt
  properties:
    id:
      $ref: '../../components/common.yaml#/UUIDv7'
    companyId:
      $ref: '../../components/common.yaml#/UUIDv7'
    name:
      type: string
      example: "CTO-CENTRO-01"
    poleId:
      $ref: '../../components/common.yaml#/UUIDv7'
    poleCode:
      type: string
      nullable: true
      example: "POSTE-CPFL-9021"
    closureId:
      $ref: '../../components/common.yaml#/UUIDv7'
    latitude:
      type: number
      format: double
      example: -23.550520
    longitude:
      type: number
      format: double
      example: -46.633308
    totalPorts:
      type: integer
      example: 16
    freePortsCount:
      type: integer
      example: 12
    occupiedPortsCount:
      type: integer
      example: 4
    occupancyPercentage:
      type: number
      format: double
      example: 25.0
    splitterType:
      type: string
      example: "BALANCED_1_16"
    status:
      type: string
      example: "ATIVA"
    description:
      type: string
      nullable: true
