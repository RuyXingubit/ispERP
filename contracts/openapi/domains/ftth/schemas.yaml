    targetCableName:
      type: string
      nullable: true
    targetFiberNumber:
      type: integer
      nullable: true
    targetFiberColor:
      $ref: '#/FiberColorInfo'
    targetSplitterId:
      $ref: '../../components/common.yaml#/UUIDv7'
    targetSplitterName:
      type: string
