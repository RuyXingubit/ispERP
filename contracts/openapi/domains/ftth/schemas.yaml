    cumulativeAttenuationDb:
      type: number
      format: double
      example: 13.8

LightPathTraceResult:
  type: object
  required:
    - reachedSource
    - totalAttenuationDb
    - estimatedRxPowerDbm
    - nodes
  properties:
    reachedSource:
      type: boolean
      example: true
    sourcePopName:
      type: string
      nullable: true
      example: "POP Central Matriz"
    totalAttenuationDb:
      type: number
      format: double
      example: 22.45
    estimatedRxPowerDbm:
      type: number
      format: double
      example: -18.45
    nodes:
      type: array
      items:
        $ref: '#/LightPathNode'

OltPonPortRequest:
