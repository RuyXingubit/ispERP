      $ref: '#/FtthClosureResponse'
    cables:
      type: array
      items:
        $ref: '#/FtthCableResponse'
    splitters:
      type: array
      items:
        $ref: '#/FtthSplitterResponse'
    fusions:
      type: array
      items:
        $ref: '#/FtthFusionResponse'
    connectedCtos:
      type: array
      items:
        $ref: '#/FtthCtoResponse'

FeasibleCtoItem:
  type: object
  required:
