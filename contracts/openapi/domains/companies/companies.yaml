/companies:
  get:
    tags:
      - Companies
    summary: Listar todas as empresas/filiais cadastradas
    operationId: getAllCompanies
    responses:
      '200':
        description: Lista de empresas
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: './schemas.yaml#/CompanyResponse'

  post:
    tags:
      - Companies
    summary: Cadastrar nova empresa/filial
    operationId: createCompany
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CompanyCreateRequest'
    responses:
      '201':
        description: Empresa criada com sucesso
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyResponse'
      '400':
        description: Dados inválidos
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

/companies/primary:
  get:
    tags:
      - Companies
    summary: Buscar a empresa principal (Matriz)
    operationId: getPrimaryCompany
    responses:
      '200':
        description: Dados da empresa principal
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyResponse'
      '404':
        description: Nenhuma empresa cadastrada
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

/companies/{id}:
  get:
    tags:
      - Companies
    summary: Buscar empresa/filial por ID
    operationId: getCompanyById
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Detalhes da empresa
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyResponse'
      '404':
        description: Empresa não encontrada
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

  put:
    tags:
      - Companies
    summary: Atualizar dados de empresa/filial por ID
    operationId: updateCompany
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: './schemas.yaml#/CompanyUpdateRequest'
    responses:
      '200':
        description: Empresa atualizada com sucesso
        content:
          application/json:
            schema:
              $ref: './schemas.yaml#/CompanyResponse'
      '400':
        description: Dados inválidos
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'
      '404':
        description: Empresa não encontrada
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'

  delete:
    tags:
      - Companies
    summary: Remover empresa/filial por ID
    operationId: deleteCompany
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: Empresa removida com sucesso
      '404':
        description: Empresa não encontrada
        content:
          application/json:
            schema:
              $ref: '../../components/errors.yaml#/ProblemDetails'
