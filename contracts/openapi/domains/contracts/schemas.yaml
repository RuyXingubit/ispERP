    symbolicAmount:
      type: number
      format: double
    pixCopyPaste:
      type: string
      nullable: true
    pixQrCodeBase64:
      type: string
      nullable: true
    payerName:
      type: string
      nullable: true
    payerBankName:
      type: string
      nullable: true
    rejectionReason:
      type: string
      nullable: true
    signedPdfUrl:
      type: string
      nullable: true
    documentSha256Hash:
      type: string
      nullable: true
    fallbackMethod:
      $ref: '#/FallbackMethod'
    onboardingCreditAmount:
      type: number
      format: double
      nullable: true
    forensicCertificatePdfUrl:
      type: string
      nullable: true
    expiresAt:
      type: string
      format: date-time
    signedAt:
      type: string
      format: date-time
      nullable: true

FallbackSelectionRequest:
  type: object
  required:
    - fallbackMethod
  properties:
    fallbackMethod:
      $ref: '#/FallbackMethod'
    justification:
      type: string
      nullable: true

PixSignatureWebhookRequest:
  type: object
  required:
    - txid
    - endToEndId
    - amount
    - payerName
    - payerCpfCnpj
  properties:
    txid:
      type: string
    endToEndId:
      type: string
    amount:
      type: number
      format: double
    payerName:
      type: string
    payerCpfCnpj:
      type: string
    bankName:
      type: string
      nullable: true
    ispb:
      type: string
      nullable: true

ContractTemplateRequest:
