    status:
      $ref: '#/ContractStatus'
    monthlyFee:
      type: number
      format: double
      example: 99.90
    dueDay:
      type: integer
      example: 10
    customSuspensionDays:
      type: integer
      nullable: true
      example: 15
    installationAddress:
      type: string
      example: "Av. Principal, 1200, Bairro Centro"
    city:
      type: string
      nullable: true
      example: "São Paulo"
    state:
      type: string
      nullable: true
      example: "SP"
    zipCode:
      type: string
      nullable: true
      example: "01001-000"
    ctoId:
      $ref: '../../components/common.yaml#/UUIDv7'
    ctoPortNumber:
      type: integer
      nullable: true
      example: 4
    pendingOnboardingCredit:
      type: number
      format: double
      nullable: true
      example: 0.0

ContractUpdateRequest:
  type: object
  properties:
    planId:
      $ref: '../../components/common.yaml#/UUIDv7'
    monthlyFee:
      type: number
      format: double
      example: 99.90
    dueDay:
      type: integer
      example: 10
    customSuspensionDays:
      type: integer
      nullable: true
      example: 15
    installationAddress:
      type: string
      example: "Av. Principal, 1200, Bairro Centro"
    city:
      type: string
      nullable: true
      example: "São Paulo"
    state:
      type: string
      nullable: true
      example: "SP"
    zipCode:
      type: string
      nullable: true
