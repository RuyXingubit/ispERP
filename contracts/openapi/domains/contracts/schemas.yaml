UpdateContractStatusRequest:
  type: object
  required:
    - status
  properties:
    status:
      $ref: '#/ContractStatus'
    reason:
      type: string
      nullable: true
      description: "Justificativa para a alteração de status (ex: inadimplência, pedido do assinante)."
      example: "Solicitação expressa do cliente via central de atendimento."
