openapi: 3.0.3
info:
  title: ispERP API
  version: 1.0.0
  description: >
    Especificação formal dos contratos de API do ispERP (Sistema ERP Modular para Provedores de Internet).
    Governada pela diretriz mandatória de API-First (.agents/rules/api-first-contracts.md).
  contact:
    name: Equipe de Engenharia ispERP
    url: https://github.com/RuyXingubit/ispERP
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://localhost:8080/api
    description: Servidor de Desenvolvimento Local
  - url: /api
    description: Servidor Padrão (Ambiente de Produção / Docker)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Autenticação (Login e tokens JWT)
  - name: Users
    description: Usuários & Colaboradores (Gestão de acessos e RBAC)
  - name: WorkOrders
    description: Ordens de Serviço (Agendamento, roteirização e conclusão de O.S.)
  - name: TechnicianExecution
    description: Execução Técnica de Campo (Auto-Discovery OLT, provisionamento ONU e testes RADIUS)
  - name: Invoices
    description: Faturamento & Cobrança (Faturas, PIX, liquidação e rotina recorrente)
  - name: Contracts
    description: Contratos (Gestão de planos, minutas e status contratual)
  - name: Customers
    description: Clientes (Cadastro e busca de assinantes)
  - name: NetworkDevices
    description: Dispositivos de Rede (OLTs, BNGs, Concentradores)
  - name: Onus
    description: Provisionamento e Diagnóstico de ONUs em OLTs
  - name: Nas
    description: Servidores NAS / BNG do FreeRADIUS
  - name: RadiusSessions
    description: Sessões PPPoE ativas, histórico e desconexão PoD
  - name: RadiusLifecycle
    description: Gestão de políticas de auto-corte, bloqueios e auditoria de ações PoD
  - name: Plans
    description: Catálogo de Planos de Internet e Valores
  - name: Companies
    description: Cadastro e Gestão de Empresas / Filiais do Provedor
  - name: Sales
    description: Propostas Comerciais e Vendas de Planos

paths:
  # Ordens de Serviço & Execução de Campo
  /work-orders:
    $ref: './domains/workorders/workorders.yaml#/~1work-orders'
  /work-orders/{id}:
    $ref: './domains/workorders/workorders.yaml#/~1work-orders~1{id}'
  /work-orders/{id}/schedule:
    $ref: './domains/workorders/workorders.yaml#/~1work-orders~1{id}~1schedule'
  /work-orders/{id}/complete:
    $ref: './domains/workorders/workorders.yaml#/~1work-orders~1{id}~1complete'
  /technician/execution/{workOrderId}/unprovisioned-onus:
    $ref: './domains/workorders/workorders.yaml#/~1technician~1execution~1{workOrderId}~1unprovisioned-onus'
  /technician/execution/{workOrderId}/provision:
    $ref: './domains/workorders/workorders.yaml#/~1technician~1execution~1{workOrderId}~1provision'
  /technician/execution/{workOrderId}/radius-status:
    $ref: './domains/workorders/workorders.yaml#/~1technician~1execution~1{workOrderId}~1radius-status'

  # Faturamento & Cobrança
  /invoices:
    $ref: './domains/billing/invoices.yaml#/~1invoices'
  /invoices/{id}:
    $ref: './domains/billing/invoices.yaml#/~1invoices~1{id}'
  /invoices/customer/{customerId}:
    $ref: './domains/billing/invoices.yaml#/~1invoices~1customer~1{customerId}'
  /invoices/contract/{contractId}:
    $ref: './domains/billing/invoices.yaml#/~1invoices~1contract~1{contractId}'
  /invoices/generate/contract/{contractId}:
    $ref: './domains/billing/invoices.yaml#/~1invoices~1generate~1contract~1{contractId}'
  /invoices/{id}/pay:
    $ref: './domains/billing/invoices.yaml#/~1invoices~1{id}~1pay'
  /invoices/{id}/cancel:
    $ref: './domains/billing/invoices.yaml#/~1invoices~1{id}~1cancel'
  /invoices/trigger-recurring-billing:
    $ref: './domains/billing/invoices.yaml#/~1invoices~1trigger-recurring-billing'

  # Contratos
  /contracts:
    $ref: './domains/contracts/contracts.yaml#/~1contracts'
  /contracts/{id}:
    $ref: './domains/contracts/contracts.yaml#/~1contracts~1{id}'
  /contracts/customer/{customerId}:
    $ref: './domains/contracts/contracts.yaml#/~1contracts~1customer~1{customerId}'
  /contracts/status/{status}:
    $ref: './domains/contracts/contracts.yaml#/~1contracts~1status~1{status}'
  /contracts/{id}/status:
    $ref: './domains/contracts/contracts.yaml#/~1contracts~1{id}~1status'

  # Clientes
  /customers:
    $ref: './domains/customers/customers.yaml#/~1customers'
  /customers/active:
    $ref: './domains/customers/customers.yaml#/~1customers~1active'
  /customers/cpf/{cpf}:
    $ref: './domains/customers/customers.yaml#/~1customers~1cpf~1{cpf}'
  /customers/{id}:
    $ref: './domains/customers/customers.yaml#/~1customers~1{id}'
  /customers/search:
    $ref: './domains/customers/customers.yaml#/~1customers~1search'
  /customers/search/name:
    $ref: './domains/customers/customers.yaml#/~1customers~1search~1name'
  /customers/search/cpf:
    $ref: './domains/customers/customers.yaml#/~1customers~1search~1cpf'
  /customers/{id}/activate:
    $ref: './domains/customers/customers.yaml#/~1customers~1{id}~1activate'
  /customers/{id}/deactivate:
    $ref: './domains/customers/customers.yaml#/~1customers~1{id}~1deactivate'

  # Autenticação
  /auth/login:
    $ref: './domains/auth/auth.yaml#/~1auth~1login'

  # Usuários
  /users:
    $ref: './domains/users/users.yaml#/~1users'
  /users/{id}:
    $ref: './domains/users/users.yaml#/~1users~1{id}'

  # Dispositivos de Rede (OLTs)
  /network-devices:
    $ref: './domains/network/devices.yaml#/~1network-devices'
  /network-devices/{id}:
    $ref: './domains/network/devices.yaml#/~1network-devices~1{id}'

  # Provisionamento de ONUs
  /onus:
    $ref: './domains/network/onus.yaml#/~1onus'
  /onus/{id}:
    $ref: './domains/network/onus.yaml#/~1onus~1{id}'
  /onus/contract/{contractId}:
    $ref: './domains/network/onus.yaml#/~1onus~1contract~1{contractId}'
  /onus/contract/{contractId}/block:
    $ref: './domains/network/onus.yaml#/~1onus~1contract~1{contractId}~1block'
  /onus/contract/{contractId}/unblock:
    $ref: './domains/network/onus.yaml#/~1onus~1contract~1{contractId}~1unblock'
  /onus/{id}/diagnose:
    $ref: './domains/network/onus.yaml#/~1onus~1{id}~1diagnose'

  # RADIUS (NAS, Sessões e Auto-Corte Lifecycle)
  /radius/nas:
    $ref: './domains/radius/radius.yaml#/~1radius~1nas'
  /radius/nas/{id}:
    $ref: './domains/radius/radius.yaml#/~1radius~1nas~1{id}'
  /radius/sessions/active:
    $ref: './domains/radius/radius.yaml#/~1radius~1sessions~1active'
  /radius/sessions/history/{username}:
    $ref: './domains/radius/radius.yaml#/~1radius~1sessions~1history~1{username}'
  /radius/disconnect:
    $ref: './domains/radius/radius.yaml#/~1radius~1disconnect'
  /radius/lifecycle/summary:
    $ref: './domains/radius/radius.yaml#/~1radius~1lifecycle~1summary'
  /radius/lifecycle/policy:
    $ref: './domains/radius/radius.yaml#/~1radius~1lifecycle~1policy'
  /radius/lifecycle/logs:
    $ref: './domains/radius/radius.yaml#/~1radius~1lifecycle~1logs'
  /radius/lifecycle/action:
    $ref: './domains/radius/radius.yaml#/~1radius~1lifecycle~1action'
  /radius/lifecycle/run-autoblock:
    $ref: './domains/radius/radius.yaml#/~1radius~1lifecycle~1run-autoblock'

  # Planos de Acesso à Internet
  /plans:
    $ref: './domains/plans/plans.yaml#/~1plans'
  /plans/active:
    $ref: './domains/plans/plans.yaml#/~1plans~1active'
  /plans/{id}:
    $ref: './domains/plans/plans.yaml#/~1plans~1{id}'

  # Empresas / Filiais
  /companies:
    $ref: './domains/companies/companies.yaml#/~1companies'
  /companies/primary:
    $ref: './domains/companies/companies.yaml#/~1companies~1primary'
  /companies/{id}:
    $ref: './domains/companies/companies.yaml#/~1companies~1{id}'

  # Vendas / Propostas Comerciais
  /sales:
    $ref: './domains/sales/sales.yaml#/~1sales'
  /sales/{id}:
    $ref: './domains/sales/sales.yaml#/~1sales~1{id}'

components:
  securitySchemes:
    bearerAuth:
      $ref: './components/security.yaml#/bearerAuth'

  schemas:
    # Comuns & Erros
    UUIDv7:
      $ref: './components/common.yaml#/UUIDv7'
    PageResponse:
      $ref: './components/common.yaml#/PageResponse'
    ProblemDetails:
      $ref: './components/errors.yaml#/ProblemDetails'
    InvalidParam:
      $ref: './components/errors.yaml#/InvalidParam'

    # WorkOrders & Field Execution
    WorkOrderStatus:
      $ref: './domains/workorders/schemas.yaml#/WorkOrderStatus'
    WorkOrderType:
      $ref: './domains/workorders/schemas.yaml#/WorkOrderType'
    WorkOrderResponse:
      $ref: './domains/workorders/schemas.yaml#/WorkOrderResponse'
    ScheduleWorkOrderRequest:
      $ref: './domains/workorders/schemas.yaml#/ScheduleWorkOrderRequest'
    CompleteWorkOrderRequest:
      $ref: './domains/workorders/schemas.yaml#/CompleteWorkOrderRequest'
    OltUnprovisionedOnu:
      $ref: './domains/workorders/schemas.yaml#/OltUnprovisionedOnu'
    ProvisionOnuRequest:
      $ref: './domains/workorders/schemas.yaml#/ProvisionOnuRequest'
    RadiusStatusResponse:
      $ref: './domains/workorders/schemas.yaml#/RadiusStatusResponse'

    # Billing
    InvoiceStatus:
      $ref: './domains/billing/schemas.yaml#/InvoiceStatus'
    InvoiceResponse:
      $ref: './domains/billing/schemas.yaml#/InvoiceResponse'
    PayInvoiceRequest:
      $ref: './domains/billing/schemas.yaml#/PayInvoiceRequest'
    TriggerRecurringBillingResponse:
      $ref: './domains/billing/schemas.yaml#/TriggerRecurringBillingResponse'

    # Contracts
    ContractStatus:
      $ref: './domains/contracts/schemas.yaml#/ContractStatus'
    ContractResponse:
      $ref: './domains/contracts/schemas.yaml#/ContractResponse'
    UpdateContractStatusRequest:
      $ref: './domains/contracts/schemas.yaml#/UpdateContractStatusRequest'

    # Customers
    CustomerResponse:
      $ref: './domains/customers/schemas.yaml#/CustomerResponse'
    CustomerCreateRequest:
      $ref: './domains/customers/schemas.yaml#/CustomerCreateRequest'
    CustomerUpdateRequest:
      $ref: './domains/customers/schemas.yaml#/CustomerUpdateRequest'

    # Auth
    LoginRequest:
      $ref: './domains/auth/schemas.yaml#/LoginRequest'
    LoginResponse:
      $ref: './domains/auth/schemas.yaml#/LoginResponse'

    # Users
    UserRole:
      $ref: './domains/users/schemas.yaml#/UserRole'
    UserResponse:
      $ref: './domains/users/schemas.yaml#/UserResponse'
    UserCreateRequest:
      $ref: './domains/users/schemas.yaml#/UserCreateRequest'
    UserUpdateRequest:
      $ref: './domains/users/schemas.yaml#/UserUpdateRequest'

    # Network
    NetworkDriverType:
      $ref: './domains/network/schemas.yaml#/NetworkDriverType'
    NetworkDeviceResponse:
      $ref: './domains/network/schemas.yaml#/NetworkDeviceResponse'
    NetworkDeviceCreateRequest:
      $ref: './domains/network/schemas.yaml#/NetworkDeviceCreateRequest'
    OnuStatusEnum:
      $ref: './domains/network/schemas.yaml#/OnuStatusEnum'
    OnuResponse:
      $ref: './domains/network/schemas.yaml#/OnuResponse'
    OnuStatusResponse:
      $ref: './domains/network/schemas.yaml#/OnuStatusResponse'

    # RADIUS
    NasVendorType:
      $ref: './domains/radius/schemas.yaml#/NasVendorType'
    NasRequest:
      $ref: './domains/radius/schemas.yaml#/NasRequest'
    NasResponse:
      $ref: './domains/radius/schemas.yaml#/NasResponse'
    RadiusSessionResponse:
      $ref: './domains/radius/schemas.yaml#/RadiusSessionResponse'
    RadiusDisconnectRequest:
      $ref: './domains/radius/schemas.yaml#/RadiusDisconnectRequest'
    RadiusDisconnectResponse:
      $ref: './domains/radius/schemas.yaml#/RadiusDisconnectResponse'
    RadiusBlockMode:
      $ref: './domains/radius/schemas.yaml#/RadiusBlockMode'
    RadiusLifecycleActionType:
      $ref: './domains/radius/schemas.yaml#/RadiusLifecycleActionType'
    RadiusLifecycleSummaryResponse:
      $ref: './domains/radius/schemas.yaml#/RadiusLifecycleSummaryResponse'
    RadiusPolicyConfigResponse:
      $ref: './domains/radius/schemas.yaml#/RadiusPolicyConfigResponse'
    RadiusPolicyConfigRequest:
      $ref: './domains/radius/schemas.yaml#/RadiusPolicyConfigRequest'
    RadiusManualActionRequest:
      $ref: './domains/radius/schemas.yaml#/RadiusManualActionRequest'
    RadiusManualActionResponse:
      $ref: './domains/radius/schemas.yaml#/RadiusManualActionResponse'
    RadiusLifecycleLogResponse:
      $ref: './domains/radius/schemas.yaml#/RadiusLifecycleLogResponse'
    RadiusLifecycleLogsPageResponse:
      $ref: './domains/radius/schemas.yaml#/RadiusLifecycleLogsPageResponse'

    # Plans
    PlanResponse:
      $ref: './domains/plans/schemas.yaml#/PlanResponse'
    PlanCreateRequest:
      $ref: './domains/plans/schemas.yaml#/PlanCreateRequest'
    PlanUpdateRequest:
      $ref: './domains/plans/schemas.yaml#/PlanUpdateRequest'

    # Companies
    CompanyResponse:
      $ref: './domains/companies/schemas.yaml#/CompanyResponse'
    CompanyCreateRequest:
      $ref: './domains/companies/schemas.yaml#/CompanyCreateRequest'
    CompanyUpdateRequest:
      $ref: './domains/companies/schemas.yaml#/CompanyUpdateRequest'

    # Sales
    SaleStatusEnum:
      $ref: './domains/sales/schemas.yaml#/SaleStatusEnum'
    SaleResponse:
      $ref: './domains/sales/schemas.yaml#/SaleResponse'
    CreateSaleRequest:
      $ref: './domains/sales/schemas.yaml#/CreateSaleRequest'

