  # Topologia FTTH (POPs, Postes, Cabos, CEOs, Fusões, CTOs, Viabilidade e Rastreamento Óptico)
  /ftth/pops:
    $ref: './domains/ftth/topology.yaml#/~1ftth~1pops'
