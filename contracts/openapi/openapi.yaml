  # Vendas / Propostas Comerciais
  /sales:
    $ref: './domains/sales/sales.yaml#/~1sales'
  /sales/{id}:
    $ref: './domains/sales/sales.yaml#/~1sales~1{id}'

  # Helpdesk & Atendimento ao Cliente
  /helpdesk/tickets:
    $ref: './domains/helpdesk/helpdesk.yaml#/~1helpdesk~1tickets'
  /helpdesk/tickets/{id}:
