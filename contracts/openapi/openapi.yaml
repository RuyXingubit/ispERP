openapi: 3.0.3
info:
  title: ispERP API
  version: 1.0.0
  description: >
    Especificação formal dos contratos de API do ispERP (Sistema ERP Modular para Provedores de Internet).
  contact:
    name: Equipe de Engenharia ispERP
    url: https://github.com/RuyXingubit/ispERP
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: http://localhost:8080/api
    description: Servidor de Desenvolvimento Local
  - url: /api
    description: Servidor Padrão (Ambiente de Produção / Docker)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Autenticação (Login e tokens JWT)
  - name: Users
    description: Usuários & Colaboradores (Gestão de acessos e RBAC)
  - name: WorkOrders
    description: Ordens de Serviço (Agendamento, roteirização e conclusão de O.S.)
  - name: TechnicianExecution
    description: Execução Técnica de Campo (Auto-Discovery OLT, provisionamento ONU e testes RADIUS)
  - name: Invoices
    description: Faturamento & Cobrança (Faturas, PIX, liquidação e rotina recorrente)
  - name: Contracts
    description: Contratos (Gestão de planos, minutas e status contratual)
  - name: Customers
    description: Clientes (Cadastro e busca de assinantes)
  - name: NetworkDevices
    description: Dispositivos de Rede (OLTs, BNGs, Concentradores)
  - name: Onus
    description: Provisionamento e Diagnóstico de ONUs em OLTs
  - name: Nas
    description: Servidores NAS / BNG do FreeRADIUS
  - name: RadiusSessions
    description: Sessões PPPoE ativas, histórico e desconexão PoD
  - name: RadiusLifecycle
    description: Gestão de políticas de auto-corte, bloqueios e auditoria de ações PoD
  - name: Plans
    description: Catálogo de Planos de Internet e Valores
  - name: Companies
    description: Cadastro e Gestão de Empresas / Filiais do Provedor
  - name: Sales
    description: Propostas Comerciais e Vendas de Planos
  - name: Helpdesk
    description: Suporte Técnico, Atendimento ao Cliente e Chamados ANATEL
  - name: Inventory
    description: Catálogo de Insumos, Materiais e Saldo em Estoque
  - name: Warehouses
    description: Depósitos e Almoxarifados Físicos
  - name: AssetCustody
    description: Custódia de Ativos Serializados, Transferências Inter-Bases e Ferramental
  - name: Fiscal
    description: Empresa Fiscal, Certificados Digitais A1, Emissão de NFCom (Modelo 62) e Convênio 115
  - name: FiscalRegimeTransitions
    description: Transição e Agendamento de Regimes Tributários (Simples Nacional, Lucro Presumido, Lucro Real)
  - name: ClientPortal
    description: Central do Assinante (Autenticação via PIN, consulta de faturas, desbloqueio em confiança e solicitação de upgrade)
  - name: BillingDunning
    description: Régua de Cobrança, Rebalanceamento de Créditos Cruzados e Políticas de Desbloqueio em Confiança
  - name: SiteSettings
    description: Configurações Institucionais e Visuais do Provedor (Site Vitrine e Central do Assinante)
  - name: AuditLogs
    description: Trilha Imutável de Auditoria Administrativa e Governança
  - name: Signatures
    description: Assinatura Eletrônica e Sessões de Contrato
  - name: SignatureWebhooks
    description: Webhooks de Notificação Pix para Assinatura Eletrônica
  - name: ContractTemplates
    description: Gestão de Minutas e Templates Contratuais
  - name: Cgnat
    description: CGNAT e Mapeamento Forense Multi-Vendor
  - name: MarcoCivil
    description: Investigação Forense e Marco Civil da Internet (Lei 12.965/2014)
  - name: PublicVerification
    description: Validação Pública de Autenticidade de Laudos Periciais
  - name: Ipam
    description: Gestão de Endereçamento IP (IPAM), Sub-redes, ASNs e VRFs
  - name: FtthTopology
    description: Topologia de Rede FTTH (POPs, Postes, Cabos, Caixas de Emenda, Fusões, CTOs e Rastreamento Óptico)
  - name: FtthMonitoring
    description: Monitoramento Proativo NOC e Correlação de Incidentes PON
  - name: InstallationDispatch
    description: Torre de Controle de Despacho Técnico e Triagem de Materiais FTTH
  - name: GeoCep
    description: Geocodificação, Consulta de CEP e Otimização de Rotas de Atendimento
  - name: InitialSetup
    description: Assistente de Configuração Inicial do Provedor
  - name: StorageConfig
    description: Configuração de Armazenamento de Objetos S3 / SeaweedFS Local
  - name: FileStorage
    description: Upload e Recuperação de Arquivos, Comprovantes e Mídias
  - name: NotificationConfigs
    description: Configurações de Notificações e Provedores WhatsApp/SMS
  - name: PaymentGatewayConfig
    description: Configuração de Gateways de Pagamento (PIX, Boleto, Cartão)
  - name: PaymentWebhooks
    description: Webhooks de Notificação de Pagamentos Recebidos
  - name: DashboardBi
    description: Métricas Executivas, MRR, ARPU, Churn e Saúde Operacional do Provedor
  - name: BackupDisasterRecovery
    description: Governança de Backup Criptografado AES-256, Destinos Remotos e Kit de Resgate

