  /inventory/custody/assets/{id}/reverse-logistics:
    $ref: './domains/inventory/inventory.yaml#/~1inventory~1custody~1assets~1{id}~1reverse-logistics'

  # Fiscal, NFCom (Mod. 62) & Transição de Regimes
  /fiscal/company:
    $ref: './domains/fiscal/fiscal.yaml#/~1fiscal~1company'
  /fiscal/company/{companyId}/certificate:
