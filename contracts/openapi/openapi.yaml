  /helpdesk/tickets/{id}/escalate-work-order:
    $ref: './domains/helpdesk/helpdesk.yaml#/~1helpdesk~1tickets~1{id}~1escalate-work-order'
  /helpdesk/tickets/{id}/interactions:
    $ref: './domains/helpdesk/helpdesk.yaml#/~1helpdesk~1tickets~1{id}~1interactions'
  /helpdesk/tickets/{id}/close:
    $ref: './domains/helpdesk/helpdesk.yaml#/~1helpdesk~1tickets~1{id}~1close'

  # Estoque, Depósitos & Custódia de Ativos
  /inventory:
    $ref: './domains/inventory/inventory.yaml#/~1inventory'
  /warehouses:
    $ref: './domains/inventory/inventory.yaml#/~1warehouses'
  /warehouses/active:
    $ref: './domains/inventory/inventory.yaml#/~1warehouses~1active'
  /warehouses/{id}:
