services:
  postgres:
    image: postgres:17-alpine
    container_name: isperp-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-isperp}
      POSTGRES_USER: ${DB_USERNAME:-isperp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - isperp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-isperp} -d ${DB_NAME:-isperp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: isperp-seaweedfs
    command: "server -dir=/data -s3 -s3.port=8333"
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    networks:
      - isperp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/"]
      interval: 15s
      timeout: 5s
      retries: 3

  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: isperp-freeradius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "3799:3799/udp"
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DB_USERNAME:-isperp}
      DATABASE_PASS: ${DB_PASSWORD:-password}
      DATABASE_NAME: ${DB_NAME:-isperp}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - isperp-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: isperp-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-isperp}
      DB_USERNAME: ${DB_USERNAME:-isperp}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://seaweedfs:8333}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-isperp-files}
      JWT_SECRET: ${JWT_SECRET:-myVerySecureSecretKeyThatIsAtLeast256BitsLongForJWTSecurityAndMustBeAtLeast32CharactersLongToMeetTheRequirements}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - isperp-network
    volumes:
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: isperp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - isperp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  seaweedfs_data:
    driver: local

networks:
  isperp-network:
    driver: bridge