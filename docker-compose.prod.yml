services:
  postgres:
    image: postgres:17-alpine
    container_name: isperp-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-isperp}
      POSTGRES_USER: ${DB_USERNAME:-isperp}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - isperp-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-isperp} -d ${DB_NAME:-isperp}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: isperp-seaweedfs-prod
    command: "server -dir=/data -s3 -s3.port=8333"
    volumes:
      - seaweedfs_prod_data:/data
    networks:
      - isperp-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8333/" ]
      interval: 15s
      timeout: 5s
      retries: 3

  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: isperp-freeradius-prod
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "3799:3799/udp"
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DB_USERNAME:-isperp}
      DATABASE_PASS: ${DB_PASSWORD}
      DATABASE_NAME: ${DB_NAME:-isperp}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - isperp-network
    restart: unless-stopped

  backend:
    image: ${DOCKER_REGISTRY:-localhost}/isperp-backend:${VERSION:-latest}
    container_name: isperp-backend-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-isperp}
      DB_USERNAME: ${DB_USERNAME:-isperp}
      DB_PASSWORD: ${DB_PASSWORD}
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://seaweedfs:8333}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-isperp-files}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - isperp-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ${DOCKER_REGISTRY:-localhost}/isperp-frontend:${VERSION:-latest}
    container_name: isperp-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - isperp-network
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: isperp-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - isperp-network
    restart: unless-stopped

volumes:
  postgres_prod_data:
    driver: local
  seaweedfs_prod_data:
    driver: local

networks:
  isperp-network:
    driver: bridge
