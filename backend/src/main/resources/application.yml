server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: isp-erp
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:isperp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

logging:
  level:
    br.dev.xb.isperp: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  storage:
    type: ${STORAGE_TYPE:s3}
    local:
      directory: ${STORAGE_LOCAL_DIR:./uploads}
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:8333}
      bucket: ${STORAGE_S3_BUCKET:isperp-files}
      region: ${STORAGE_S3_REGION:us-east-1}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
      path-style-access: ${STORAGE_S3_PATH_STYLE:true}