spring:
  application:
    name: isp-erp-test
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

logging:
  level:
    org.flywaydb: INFO
    org.testcontainers: INFO
    br.dev.xb.isperp: DEBUG

outbox:
  dispatcher:
    fixed-delay-ms: 3600000

billing:
  scheduler:
    cron: "0 0 0 1 1 ?"
