plugins {
    id 'java'
    id 'jacoco'
    id 'pmd'
    id 'eclipse'
    id 'idea'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.11.0'
    id 'org.sonarqube' version '7.5.0.8588'
}

group = 'br.dev.xb'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('tomcat.version', '11.0.27')
    set('freemarker.version', '2.3.35')
    set('logback.version', '1.6.5')
    set('log4j2.version', '2.26.1')
    set('jackson-2-bom.version', '2.22.4')
    set('jackson-bom.version', '3.2.4')
    set('postgresql.version', '42.7.14')
    set('snakeyaml.version', '2.7')
    set('commons-lang3.version', '3.21.0')
    set('commons-codec.version', '1.23.0')
    set('commons-io.version', '2.22.0')
    set('gson.version', '2.14.0')
}

configurations.configureEach {
    exclude group: 'org.hdrhistogram', module: 'HdrHistogram'
    exclude group: 'org.glassfish.jaxb', module: 'jaxb-runtime'
    exclude group: 'org.glassfish.jaxb', module: 'jaxb-core'
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'ch.qos.logback') {
            details.useVersion('1.6.5')
        } else if (details.requested.group.startsWith('com.fasterxml.jackson')) {
            if (details.requested.name == 'jackson-annotations') {
                details.useVersion('2.22')
            } else {
                details.useVersion('2.22.4')
            }
        } else if (details.requested.group.startsWith('tools.jackson')) {
            details.useVersion('3.2.4')
        } else if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-compress') {
            details.useVersion('1.28.0')
        } else if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
            details.useVersion('3.21.0')
        } else if (details.requested.group == 'commons-io' && details.requested.name == 'commons-io') {
            details.useVersion('2.22.0')
        } else if (details.requested.group == 'commons-codec' && details.requested.name == 'commons-codec') {
            details.useVersion('1.23.0')
        } else if (details.requested.group == 'org.apache.logging.log4j') {
            details.useVersion('2.26.1')
        } else if (details.requested.group == 'org.yaml' && details.requested.name == 'snakeyaml') {
            details.useVersion('2.7')
        } else if (details.requested.group == 'org.webjars' && details.requested.name == 'swagger-ui') {
            details.useVersion('5.34.0')
        }
    }
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-freemarker'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.freemarker:freemarker:2.3.35'
    implementation 'org.springframework:spring-context-support'
    implementation 'jakarta.mail:jakarta.mail-api:2.1.5'
    implementation 'org.eclipse.angus:jakarta.mail:2.0.3'
    
    // JSON & Serialization
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'tools.jackson.core:jackson-databind'
    
    // Database
    runtimeOnly 'org.postgresql:postgresql:42.7.14'
    implementation('org.springframework.boot:spring-boot-starter-flyway') {
        exclude group: 'tools.jackson.core', module: 'jackson-databind'
    }
    implementation('org.flywaydb:flyway-core') {
        exclude group: 'tools.jackson.core', module: 'jackson-databind'
    }
    implementation('org.flywaydb:flyway-database-postgresql') {
        exclude group: 'tools.jackson.core', module: 'jackson-databind'
    }
    
    // UUID v7 Generator (RFC 9562)
    implementation 'com.github.f4b6a3:uuid-creator:6.1.1'
    
    // JWT for authentication
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly('io.jsonwebtoken:jjwt-jackson:0.13.0') {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
    }
    
    // OpenAPI & Swagger UI (Springdoc)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // S3 Storage (AWS S3, SeaweedFS, Cloudflare R2)
    implementation 'software.amazon.awssdk:s3:2.57.3'

    // ZStandard Compression for high-throughput backups
    implementation 'com.github.luben:zstd-jni:1.5.7-24'
    
    // MapStruct & Utilities
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    
    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/../contracts/openapi/openapi.bundled.json"
    outputDir = "$buildDir/generated/openapi"
    apiPackage = "br.dev.xb.isperp.api.contract"
    modelPackage = "br.dev.xb.isperp.api.dto"
    configOptions = [
        interfaceOnly: "true",
        useSpringBoot3: "true",
        useTags: "true",
        openApiNullable: "false",
        dateLibrary: "java8",
        useBeanValidation: "true",
        generateConstructorWithAllArgs: "true",
        skipDefaultInterface: "true"
    ]
}

sourceSets {
    main {
        java {
            srcDirs += "$buildDir/generated/openapi/src/main/java"
        }
    }
}

compileJava.dependsOn tasks.openApiGenerate

eclipse {
    classpath {
        file {
            whenMerged { cp ->
                cp.entries.findAll { it.path.contains('generated') }.each {
                    it.entryAttributes['ignore_optional_problems'] = 'true'
                }
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    
    systemProperty 'docker.client.api.version', '1.45'
    systemProperty 'api.version', '1.45'
    
    // Automatically detect Docker Desktop socket on macOS if DOCKER_HOST is not set
    def macSocket = new File(System.getProperty('user.home') + '/.docker/run/docker.sock')
    if (macSocket.exists()) {
        environment 'DOCKER_HOST', 'unix://' + macSocket.absolutePath
        environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
    }
    finalizedBy jacocoTestReport
}

def jacocoExclusions = [
    '**/api/contract/**',
    '**/api/dto/**',
    '**/seeder/**'
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclusions)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclusions)
        }))
    }
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

pmd {
    toolVersion = '7.28.0'
    consoleOutput = false
    ignoreFailures = true
    ruleSets = []
    ruleSetFiles = files("${projectDir}/config/pmd/ruleset.xml")
}

def runPmdTasks = gradle.startParameter.taskNames.any { taskName ->
    taskName.contains('qualityCheck') || taskName.contains('pmd')
}

tasks.withType(Pmd).configureEach {
    enabled = runPmdTasks
    exclude '**/api/contract/**'
    exclude '**/api/dto/**'
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('qualityCheck') {
    group = 'verification'
    description = 'Executes offline code quality, static analysis (PMD), architecture rules (ArchUnit), and JaCoCo coverage verification.'
    dependsOn test, jacocoTestCoverageVerification, 'pmdMain'
}

sonar {
    properties {
        property "sonar.projectKey", "RuyXingubit_ispERP"
        property "sonar.organization", "ruyxb-atm1199"
        property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.coverage.exclusions", "**/api/contract/**,**/api/dto/**,**/seeder/**"
    }
}

tasks.named('sonar') {
    dependsOn jacocoTestReport
}
